name: Glwadys Career Studio - UX QA
on:
  push:
    branches:
      - feat/glwadys-atelier-premium-cv-letter
      - feat/glwadys-ux-integrated
      - feat/glwadys-radar-v2-autonome
      - feat/glwadys-ai-research-dossier
      - main
    paths:
      - public/job-hub/**
      - scripts/ux_smoke.cjs
      - .github/workflows/glwadys-ux-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glwadys-ux-qa
  cancel-in-progress: true
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate AI endpoint (synthetic fixtures, no API usage)
        run: node scripts/ai_contract_smoke.cjs
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile UX smoke checks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public/job-hub > /tmp/glwadys-server.log 2>&1 &
          sleep 2
          node scripts/ux_smoke.cjs
      - name: Verify one A4 page for CV and letter
        run: |
          python3 -m pip install --quiet pypdf
          python3 - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          for file in ["CV-exemple-fictif-QA.pdf", "Lettre-exemple-fictif-QA.pdf", "CV-natif-exemple-QA.pdf", "Lettre-native-exemple-QA.pdf", "CV-IA-fictif-QA.pdf", "Lettre-IA-fictive-QA.pdf"]:
              path=Path("ux-proof") / file
              pages=len(PdfReader(str(path)).pages)
              print(file, "pages:", pages)
              assert pages == 1, file + " spills over " + str(pages) + " pages"
          PY
      - name: Preserve visual proof and PDF prints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glwadys-ux-evidence
          path: ux-proof/
          if-no-files-found: warn
          retention-days: 7
