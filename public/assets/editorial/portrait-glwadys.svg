<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d22"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8c29d"/>
      <stop offset="100%" stop-color="#8c7a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d8c29d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="700" cy="650" r="450" fill="url(#glow)"/>
  
  <!-- Silhouette & Fashion Editorial Art Form -->
  <g opacity="0.9">
    <ellipse cx="600" cy="550" rx="200" ry="260" fill="#202229"/>
    <path d="M 420 780 C 420 620, 780 620, 780 780 L 850 1450 L 350 1450 Z" fill="#18191f"/>
    <!-- Subtle Golden Lighting Accent -->
    <path d="M 580 420 Q 640 500 620 620" stroke="url(#goldAcc)" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 460 760 C 520 730 680 730 740 760" stroke="#d8c29d" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>

  <!-- Editorial Typography Watermark -->
  <text x="80" y="1450" font-family="serif" font-size="110" font-weight="300" fill="#f5f3ef" opacity="0.12" letter-spacing="4">GLWADYS</text>
  <text x="80" y="1520" font-family="sans-serif" font-size="18" font-weight="600" fill="#d8c29d" letter-spacing="6" opacity="0.8">EDITORIAL / 2026</text>
  <line x1="80" y1="1340" x2="1120" y2="1340" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
