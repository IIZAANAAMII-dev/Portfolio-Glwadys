<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="mgcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b1b"/>
      <stop offset="50%" stop-color="#191316"/>
      <stop offset="100%" stop-color="#0e0c0f"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#mgcBg)"/>

  <!-- Scrapbook collage tiles -->
  <g transform="rotate(-4 600 600)">
    <rect x="150" y="150" width="420" height="420" rx="12" fill="#e27d60" fill-opacity="0.15" stroke="#e27d60" stroke-width="2"/>
    <text x="180" y="240" font-family="serif" font-size="36" fill="#f5f3ef">MGC AFTERWORK</text>
    <text x="180" y="300" font-family="sans-serif" font-size="20" fill="#e27d60">Marseille Port · 85 participantes</text>
    <circle cx="360" cy="420" r="80" fill="#e27d60" fill-opacity="0.3"/>
  </g>

  <g transform="rotate(5 700 700)">
    <rect x="580" y="320" width="460" height="520" rx="16" fill="#1f181c" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="620" y="420" font-family="serif" font-size="42" fill="#f5f3ef">COMMUNITY FIRST</text>
    <text x="620" y="480" font-family="sans-serif" font-size="22" fill="#8e929c">Créer des liens réels au-delà du feed</text>
    <rect x="620" y="530" width="380" height="240" rx="8" fill="#e27d60" fill-opacity="0.2"/>
  </g>

  <text x="120" y="1050" font-family="serif" font-size="64" font-weight="300" fill="#f5f3ef">MARSEILLE GIRLS CLUB</text>
  <text x="120" y="1110" font-family="sans-serif" font-size="20" font-weight="600" fill="#e27d60" letter-spacing="4">COMMUNITY & CONTENT STRATEGY</text>
</svg>
